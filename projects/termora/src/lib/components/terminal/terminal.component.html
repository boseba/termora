<div class="terminal" (mousedown)="focusInput($event)">
  <cdk-virtual-scroll-viewport #viewport class="terminal-container" itemSize="36" (scroll)="onScroll()">
    <div *cdkVirtualFor="let line of state().visibleLines; trackBy: trackLine" class="line"
      [class.command]="line.kind === 'command'">
      @if (line.kind === 'command') {
      <span class="prompt">></span>
      }
      <span class="content" [innerHTML]="line.renderedHtml"></span>
    </div>
  </cdk-virtual-scroll-viewport>

  @if (showInput()) {
  <termora-terminal-input #terminalInput [terminalId]="terminalId()" (commandSubmitted)="forwardCommand($event)" />
  }
</div>
