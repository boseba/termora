name: Publish to NPM

on:
    push:
        tags:
            - 'v*.*.*'

permissions:
    contents: read

jobs:
    validate:
        name: Lint, Test Coverage and Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run lint
              run: pnpm run lint

            - name: Run tests with coverage
              run: pnpm run test:coverage

            - name: Build package
              run: pnpm run build

            - name: Dry run
              working-directory: dist/termora
              run: npm publish --dry-run

    publish:
        name: Publish to NPM
        runs-on: ubuntu-latest
        needs: validate

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org/'
                  cache: pnpm

            - name: Upgrade npm
              run: npm install --global npm@latest

            - name: Display versions
              run: |
                  node --version
                  npm --version
                  pnpm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build package
              run: pnpm run build

            - name: Verify package
              working-directory: dist/termora
              run: npm pack --dry-run

            - name: Publish to npm
              working-directory: dist/termora
              run: npm publish --access public --no-git-checks

    release:
        name: Create GitHub Release
        runs-on: ubuntu-latest
        needs: publish

        permissions:
            contents: write

        steps:
            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true